on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: orange-runner
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Parse version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install git-cliff
        run: |
          set -euo pipefail
          GC_VER=$(curl -sSf https://api.github.com/repos/orhun/git-cliff/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'][1:])")
          INSTALL_DIR="$HOME/.local/bin"
          mkdir -p "$INSTALL_DIR"
          TMP_DIR=$(mktemp -d)
          curl -sSfL "https://github.com/orhun/git-cliff/releases/download/v${GC_VER}/git-cliff-${GC_VER}-x86_64-unknown-linux-musl.tar.gz" \
            -o "$TMP_DIR/git-cliff.tar.gz"
          tar -xzf "$TMP_DIR/git-cliff.tar.gz" -C "$TMP_DIR"
          BIN_PATH=$(find "$TMP_DIR" -type f -name git-cliff | head -n1)
          install -m 0755 "$BIN_PATH" "$INSTALL_DIR/git-cliff"
          rm -rf "$TMP_DIR"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          export PATH="$INSTALL_DIR:$PATH"
          "$INSTALL_DIR/git-cliff" --version

      - name: Bump version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DATE=$(date +"%Y-%m-%d %H:%M:%S")
          sed -i "s/^version: .*/version: $VERSION/" plugin/manifest
          sed -i "s/^date: .*/date: \"$DATE\"/" plugin/manifest
          sed -i "s/^version: .*/version: $VERSION/" plugin/performerAttributeTagger.yml

      - name: Update changelog
        run: git-cliff --tag "${{ github.ref_name }}" -o CHANGELOG.md

      - name: Commit version bump
        run: |
          git config user.email "ci@codeberg.org"
          git config user.name "CI"
          git add plugin/manifest plugin/performerAttributeTagger.yml CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore(release): bump version to ${{ steps.ver.outputs.version }}"
          git push origin HEAD:main

      - name: Create zip
        run: |
          python3 -c "
          import zipfile, os
          with zipfile.ZipFile('performerAttributeTagger.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk('plugin'):
                  dirs[:] = [d for d in dirs if d != '__pycache__']
                  for f in files:
                      if f.startswith('test_') or f.endswith('.pyc'):
                          continue
                      path = os.path.join(root, f)
                      zf.write(path, os.path.relpath(path, 'plugin'))
          "

      - name: Compute sha256
        id: sha
        run: echo "hash=$(sha256sum performerAttributeTagger.zip | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Delete existing release
        run: |
          ID=$(curl -sL \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
            "https://codeberg.org/api/v1/repos/surging9143/StashAttributeTagger/releases/tags/${GITHUB_REF_NAME}" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(r.get('id',''))" 2>/dev/null || true)
          if [ -n "$ID" ]; then
            curl -sL -X DELETE \
              -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
              "https://codeberg.org/api/v1/repos/surging9143/StashAttributeTagger/releases/$ID"
          fi

      - name: Create release
        id: release
        run: |
          export RELEASE_NOTES=$(git-cliff --tag "${{ github.ref_name }}" --latest --strip all)
          SHA=$(git rev-parse HEAD)
          RESP=$(curl -sL -X POST \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://codeberg.org/api/v1/repos/surging9143/StashAttributeTagger/releases" \
            -d "$(python3 -c "import json,os; print(json.dumps({'tag_name':'${{ github.ref_name }}','name':'${{ github.ref_name }}','body':os.environ['RELEASE_NOTES'],'target_commitish':'$SHA','draft':False,'prerelease':False,'make_latest':'true'}))")")
          echo "id=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")" >> $GITHUB_OUTPUT

      - name: Upload zip asset
        run: |
          curl -sL -X POST \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            "https://codeberg.org/api/v1/repos/surging9143/StashAttributeTagger/releases/${{ steps.release.outputs.id }}/assets?name=performerAttributeTagger.zip" \
            --data-binary "@performerAttributeTagger.zip"

      - name: Update pages index
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          HASH: ${{ steps.sha.outputs.hash }}
          TAG: ${{ github.ref_name }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git config --global user.email "ci@codeberg.org"
          git config --global user.name "CI"
          git clone "https://surging9143:${CODEBERG_TOKEN}@codeberg.org/surging9143/pages.git" /tmp/pages
          export DATE=$(date +"%Y-%m-%d %H:%M:%S")
          export URL="https://codeberg.org/surging9143/StashAttributeTagger/releases/download/${TAG}/performerAttributeTagger.zip"
          python3 .forgejo/update_pages.py
          cd /tmp/pages
          git add index.yml
          git diff --staged --quiet || git commit -m "Update performerAttributeTagger to v${VERSION}"
          git push
